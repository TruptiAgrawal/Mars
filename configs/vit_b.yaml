# ---------------------- Common Configs --------------------------
base:
  base_dir: "../runs/sam/"
  tag: ''
  stage: ''

logger:
  mode: ['tb']
  recorder_reduction: 'mean'

training:
  save_mode: ['all', 'best', 'latest']
  batch_size: 4             # Reduced from 8 to 4 to prevent Attention OOM
  num_workers: 8            # 8 workers is optimal for batch_size 4
  num_epochs: 21
  use_amp: true
  
  save_interval: 1
  val_check_interval: 1
  validation_interval: 1000

  lr: 0.0002
  decay_step: 2000
  decay_gamma: 0.8
  weight_decay: 0.1
  alpha: 0.99

  # load_pretrain_model: false
  # continue_training: false
  # load_optimizer: false
  # breakpoint_path: ""
                                     # Set target to 4 total epochs
  continue_training: true                            # Enable resuming
  load_pretrain_model: false
  load_optimizer: false                               # Restores optimizer states & momentum
  breakpoint_path: "../runs/sam/ddp/word_label2_fresh_4/ckpt/model_epoch_1.pth"
  

